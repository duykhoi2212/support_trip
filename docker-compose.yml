services:
  # ============================================================
  # 1. PostgreSQL 16 Database Service
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: gox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-gox_db}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - gox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gox_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gox-network

  # ============================================================
  # 2. Backend Express + TypeScript + Prisma + Cron Scheduler
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gox-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: Asia/Ho_Chi_Minh
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_strong_password@postgres:5432/gox_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-64-char-random-production-secret-key-gox-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-GoX <no-reply@gox.vn>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - gox_uploads:/app/uploads
    networks:
      - gox-network

  # ============================================================
  # 3. Frontend React SPA + Nginx Reverse Proxy
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gox-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gox-network

volumes:
  gox_pgdata:
    driver: local
  gox_uploads:
    driver: local

networks:
  gox-network:
    driver: bridge
