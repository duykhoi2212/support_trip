server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Giới hạn dung lượng tải ảnh (avatar, ảnh xe, ảnh kiện hàng, ảnh đăng kiểm)
    client_max_body_size 15M;

    # Bật nén Gzip tăng tốc độ tải ứng dụng SPA
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # Security Headers cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse Proxy toàn bộ yêu cầu Backend API
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
    }

    # Reverse Proxy thư mục ảnh Uploads từ Backend
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cache tài nguyên tĩnh của Vite (JS, CSS, Font, Image)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Fallback cho React Router (bao gồm /admin/login, /trips/:id, /my-incidents...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
